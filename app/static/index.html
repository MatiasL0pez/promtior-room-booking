<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Booking Assistant</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f8; --panel: #ffffff; --text: #111827; --muted: #6b7280; --border: #e5e7eb;
    --grid-line: #eef0f3; --accent: #4f46e5; --accent-hover: #4338ca; --accent-text: #ffffff;
    --mine: #4f46e5; --mine-text: #ffffff; --busy-a: #e5e7eb; --busy-b: #d1d5db; --danger: #b42318;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { height: 64px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 100%;
    max-width: 1440px; margin: 0 auto; padding: 0 20px;
  }
  .header-inner > div { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 0; }
  .who { color: var(--muted); font-size: 14px; }
  @media (max-width: 639px) {
    header h1 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }
  @media (max-width: 399px) {
    .who { display: none; }
  }
  button {
    font: inherit; height: 40px; padding: 0 16px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); border-radius: 10px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input, textarea {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
  }
  input { height: 44px; padding: 0 14px; }
  .hidden { display: none !important; }
  #login {
    max-width: 380px; margin: 12vh auto; padding: 32px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(17,24,39,.04);
    display: grid; gap: 14px;
  }
  #login h2 { margin: 0; font-size: 22px; font-weight: 600; }
  #login p { margin: 0; color: var(--muted); font-size: 14px; }
  #login button.primary { width: 100%; }
  .error { color: var(--danger); font-size: 14px; min-height: 1em; }
  main {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    max-width: 1440px; margin: 0 auto; padding: 20px;
  }
  @media (min-width: 1024px) {
    main { height: calc(100vh - 64px); }
  }
  @media (max-width: 1023px) {
    main { grid-template-columns: 1fr; height: auto; }
    #messages { min-height: 360px; }
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(17,24,39,.04); display: flex; flex-direction: column;
    min-height: 0; min-width: 0; overflow: hidden;
  }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { font-size: 15px; padding: 10px 14px; border-radius: 14px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-text); }
  .assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .thinking { color: var(--muted); font-style: italic; }
  .card {
    align-self: flex-start; max-width: 80%; background: var(--panel); border: 1px solid var(--border);
    border-left: 4px solid var(--accent); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px;
  }
  .card .summary { font-size: 15px; }
  .card .actions { display: flex; gap: 8px; }
  .bookings-card {
    align-self: flex-start; flex-shrink: 0; max-width: 100%; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .booking-row { padding: 8px 14px; border-top: 1px solid var(--grid-line); }
  .booking-row:first-child { border-top: none; }
  .booking-row-title { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .booking-row-details { font-size: 13px; color: var(--muted); }
  .bookings-card .show-more {
    width: 100%; height: auto; padding: 8px 14px; border: none; border-top: 1px solid var(--grid-line);
    border-radius: 0 0 12px 12px; background: none; color: var(--accent); font-size: 13px;
    font-weight: 600; text-align: left;
  }
  .bookings-card .show-more:hover { background: #f9fafb; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 16px; }
  .suggestions button { height: auto; font-size: 13px; padding: 6px 14px; border-radius: 999px; color: var(--muted); }
  .suggestions button:hover { background: #f9fafb; }
  #composer { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); }
  #composer textarea { flex: 1; height: 48px; resize: none; }
  .schedule-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .schedule-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .date-nav { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  .date-nav button { flex: 0 0 auto; }
  .date-nav .icon-button { width: 40px; padding: 0; }
  #day { flex: 1 1 auto; min-width: 0; }
  @media (max-width: 639px) {
    .date-nav { flex-basis: 100%; }
  }
  @media (min-width: 640px) {
    .date-nav { margin-left: auto; }
    #day { flex: 0 0 auto; width: 180px; }
  }
  .legend { display: flex; align-items: center; gap: 18px; padding: 14px 20px 0; color: var(--muted); font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { display: inline-block; width: 16px; height: 16px; border-radius: 4px; }
  .swatch.free { background: var(--panel); border: 1px solid var(--border); }
  .swatch.occupied { background-image: repeating-linear-gradient(45deg, var(--busy-a) 0 6px, var(--busy-b) 6px 12px); }
  .swatch.mine { background: var(--mine); }
  .schedule-error { padding: 10px 20px 0; }
  #grid-wrap { flex: 1; overflow: auto; margin: 12px 20px 0; padding-bottom: 20px; }
  table#grid { border-collapse: collapse; width: 100%; min-width: 480px; table-layout: fixed; }
  #grid th {
    position: sticky; top: 0; z-index: 2; background: var(--panel);
    text-align: left; padding: 8px; box-shadow: inset 0 -1px 0 var(--border); vertical-align: bottom;
  }
  #grid th:first-child, #grid td.time { position: sticky; left: 0; background: var(--panel); z-index: 1; }
  #grid th:first-child { z-index: 3; }
  .room-letter { font-size: 15px; font-weight: 700; }
  .room-capacity { font-size: 12px; font-weight: 400; color: var(--muted); }
  #grid td { position: relative; height: 32px; padding: 0; border-top: 1px solid var(--grid-line); vertical-align: top; }
  #grid tr.half-hour td { border-top: 1px dashed var(--bg); }
  #grid td.time { text-align: right; padding-right: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  #grid td.slot-free { background: var(--panel); }
  .booking {
    position: absolute; inset: 3px; border-radius: 8px; padding: 6px 8px;
    display: flex; flex-direction: column; justify-content: flex-start; overflow: hidden;
  }
  .booking.mine { background: var(--mine); color: var(--mine-text); }
  .booking.occupied { background-image: repeating-linear-gradient(45deg, var(--busy-a) 0 6px, var(--busy-b) 6px 12px); color: var(--text); }
  .booking.occupied .booking-title, .booking.occupied .booking-time { opacity: .8; }
  .booking-title { font-size: 13px; font-weight: 600; }
  .booking-time { font-size: 12px; }
  .booking-title, .booking-time { line-height: 1.25; flex-shrink: 0; }
  .booking.single .booking-title, .booking.double .booking-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .booking.multi .booking-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; white-space: normal; line-height: 1.25;
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Cubo Itaú · Meeting rooms</h1>
    <div><span class="who" id="who"></span><button id="logout" class="hidden" type="button">Sign out</button></div>
  </div>
</header>

<form id="login">
  <h2>Sign in</h2>
  <p>Use User1 or User2.</p>
  <input id="username" autocomplete="username" placeholder="Username" required>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
  <button class="primary" type="submit">Sign in</button>
  <div class="error" id="login-error"></div>
</form>

<main id="app" class="hidden">
  <section class="panel">
    <div id="messages"></div>
    <div class="suggestions" id="suggestions">
      <button type="button">Which rooms are free tomorrow from 10:00 to 11:00?</button>
      <button type="button">Book room B tomorrow from 15:00 to 16:00 for 4 people, title "Design review"</button>
      <button type="button">Show my bookings</button>
    </div>
    <form id="composer">
      <textarea id="input" placeholder="Ask about rooms…" maxlength="1000"></textarea>
      <button class="primary" type="submit" id="send">Send</button>
    </form>
  </section>
  <section class="panel">
    <div class="schedule-head">
      <h2>Schedule</h2>
      <div class="date-nav">
        <button type="button" id="prev-day" class="icon-button" aria-label="Previous day">‹</button>
        <input type="date" id="day">
        <button type="button" id="today">Today</button>
        <button type="button" id="next-day" class="icon-button" aria-label="Next day">›</button>
      </div>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="swatch free"></span>Free</span>
      <span class="legend-item"><span class="swatch occupied"></span>Occupied</span>
      <span class="legend-item"><span class="swatch mine"></span>Yours</span>
    </div>
    <div class="error schedule-error" id="schedule-error"></div>
    <div id="grid-wrap"><table id="grid"></table></div>
  </section>
</main>

<script>
const state = { token: null, username: null, conversationId: null, busy: false };
const byId = (id) => document.getElementById(id);

function remember(key, value) {
  try {
    if (value === null) sessionStorage.removeItem(key);
    else sessionStorage.setItem(key, value);
  } catch (error) {}
}

function recall(key) {
  try { return sessionStorage.getItem(key); } catch (error) { return null; }
}

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  let response;
  try {
    response = await fetch(path, { ...options, headers });
  } catch (error) {
    throw new Error("Could not reach the server. Check your connection and try again.");
  }
  if (response.status === 401 && state.token) {
    signOut();
    throw new Error("Your session expired. Sign in again.");
  }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    let message = body.message || `The server could not answer (${response.status}). Try again in a moment.`;
    if (typeof body.detail === "string") message = body.detail;
    throw new Error(message);
  }
  return body;
}

function showApp() {
  byId("login").classList.add("hidden");
  byId("app").classList.remove("hidden");
  byId("logout").classList.remove("hidden");
  byId("who").textContent = state.username;
  if (!byId("messages").children.length) {
    addBubble("assistant", `Hi ${state.username}! I can check availability, book rooms A–E and cancel your bookings.`);
  }
  loadSchedule();
}

function signOut() {
  state.token = null;
  state.username = null;
  state.conversationId = null;
  remember("token", null);
  remember("username", null);
  byId("login").reset();
  byId("messages").replaceChildren();
  byId("suggestions").classList.remove("hidden");
  byId("grid").replaceChildren();
  byId("day").value = "";
  byId("app").classList.add("hidden");
  byId("logout").classList.add("hidden");
  byId("login").classList.remove("hidden");
  byId("who").textContent = "";
  byId("schedule-error").textContent = "";
}

byId("login").addEventListener("submit", async (event) => {
  event.preventDefault();
  byId("login-error").textContent = "";
  const form = new URLSearchParams({ username: byId("username").value, password: byId("password").value });
  try {
    const body = await api("/auth/login", { method: "POST", body: form });
    state.token = body.access_token;
    state.username = body.username;
    remember("token", state.token);
    remember("username", state.username);
    showApp();
  } catch (error) {
    byId("login-error").textContent = error.message;
  }
});

byId("logout").addEventListener("click", signOut);

function scrollToBottom() {
  byId("messages").scrollTop = byId("messages").scrollHeight;
}

function addBubble(kind, text) {
  const bubble = document.createElement("div");
  bubble.className = `bubble ${kind}`;
  bubble.textContent = text;
  byId("messages").append(bubble);
  scrollToBottom();
  return bubble;
}

function addConfirmation(actions) {
  const card = document.createElement("div");
  card.className = "card";
  for (const action of actions) {
    const line = document.createElement("div");
    line.className = "summary";
    line.textContent = action.summary;
    card.append(line);
  }
  const buttons = document.createElement("div");
  buttons.className = "actions";
  const confirm = document.createElement("button");
  confirm.className = "primary";
  confirm.type = "button";
  confirm.textContent = "Confirm";
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.textContent = "Cancel";
  confirm.addEventListener("click", () => decide(true));
  cancel.addEventListener("click", () => decide(false));
  buttons.append(confirm, cancel);
  card.append(buttons);
  byId("messages").append(card);
  scrollToBottom();
}

const VISIBLE_BOOKINGS = 5;
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function addBookingsList(bookings) {
  const card = document.createElement("div");
  card.className = "bookings-card";
  for (const booking of bookings) {
    const date = new Date(`${booking.start.slice(0, 10)}T00:00:00Z`);
    const day = `${WEEKDAYS[date.getUTCDay()]} ${date.getUTCDate()} ${MONTHS[date.getUTCMonth()]}`;
    const time = `${booking.start.slice(11, 16)}–${booking.end.slice(11, 16)}`;
    let attendees = `${booking.attendees} attendees`;
    if (booking.attendees === 1) attendees = "1 attendee";
    const title = document.createElement("div");
    title.className = "booking-row-title";
    title.textContent = booking.title;
    const details = document.createElement("div");
    details.className = "booking-row-details";
    details.textContent = `${day} · ${time} · Room ${booking.room} · ${attendees}`;
    const row = document.createElement("div");
    row.className = "booking-row";
    if (card.children.length >= VISIBLE_BOOKINGS) row.classList.add("hidden");
    row.append(title, details);
    card.append(row);
  }
  const hiddenRows = card.querySelectorAll(".booking-row.hidden");
  if (hiddenRows.length) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "show-more";
    more.textContent = `Show ${hiddenRows.length} more`;
    more.addEventListener("click", () => {
      for (const row of hiddenRows) row.classList.remove("hidden");
      more.remove();
    });
    card.append(more);
  }
  byId("messages").append(card);
  scrollToBottom();
}

function closePendingCards() {
  for (const button of document.querySelectorAll(".card button")) button.disabled = true;
}

async function talk(path, payload) {
  state.busy = true;
  byId("send").disabled = true;
  const thinking = addBubble("assistant thinking", "Thinking…");
  try {
    const reply = await api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    state.conversationId = reply.conversation_id;
    thinking.remove();
    if (reply.reply) addBubble("assistant", reply.reply);
    if (reply.bookings && reply.bookings.length) addBookingsList(reply.bookings);
    if (reply.pending_actions.length) addConfirmation(reply.pending_actions);
    loadSchedule();
  } catch (error) {
    thinking.remove();
    addBubble("assistant", error.message);
  } finally {
    state.busy = false;
    byId("send").disabled = false;
  }
}

function decide(approve) {
  if (state.busy) return;
  closePendingCards();
  talk("/chat/decisions", { conversation_id: state.conversationId, approve });
}

function send(text) {
  const message = text.trim();
  if (!message || state.busy) return;
  closePendingCards();
  byId("suggestions").classList.add("hidden");
  addBubble("user", message);
  talk("/chat/messages", { conversation_id: state.conversationId, message });
}

byId("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  send(byId("input").value);
  byId("input").value = "";
});

byId("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    byId("composer").requestSubmit();
  }
});

for (const suggestion of byId("suggestions").querySelectorAll("button")) {
  suggestion.addEventListener("click", () => send(suggestion.textContent));
}

function officeToday() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Montevideo" }).format(new Date());
}

function addHalfHour(text) {
  const [day, clock] = text.split("T");
  let [hours, minutes] = clock.split(":").map(Number);
  minutes += 30;
  if (minutes === 60) {
    hours += 1;
    minutes = 0;
  }
  return `${day}T${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
}

function shiftDay(deltaDays) {
  const current = byId("day").value || officeToday();
  const date = new Date(current + "T00:00:00Z");
  date.setTime(date.getTime() + deltaDays * 86400000);
  byId("day").value = date.toISOString().slice(0, 10);
  loadSchedule();
}

byId("prev-day").addEventListener("click", () => shiftDay(-1));
byId("next-day").addEventListener("click", () => shiftDay(1));
byId("today").addEventListener("click", () => {
  byId("day").value = officeToday();
  loadSchedule();
});

async function loadSchedule() {
  if (!byId("day").value) byId("day").value = officeToday();
  const day = byId("day").value;
  byId("schedule-error").textContent = "";
  try {
    const rooms = await api("/rooms");
    const schedules = await Promise.all(
      rooms.map((room) => api(`/rooms/${room.room}/schedule?start=${day}T00:00&end=${day}T23:59`))
    );
    renderGrid(rooms, schedules);
  } catch (error) {
    byId("grid").replaceChildren();
    byId("schedule-error").textContent = `Could not load the schedule: ${error.message}`;
  }
}

function renderGrid(rooms, schedules) {
  const table = byId("grid");
  table.replaceChildren();
  const ranges = schedules[0].ranges;
  if (!ranges.length) return;

  const times = [];
  const gridEnd = ranges[ranges.length - 1].end;
  for (let time = ranges[0].start; time < gridEnd; time = addHalfHour(time)) times.push(time);

  const colgroup = document.createElement("colgroup");
  const timeCol = document.createElement("col");
  timeCol.style.width = "56px";
  colgroup.append(timeCol);
  for (const room of rooms) colgroup.append(document.createElement("col"));
  table.append(colgroup);

  const head = table.insertRow();
  head.append(document.createElement("th"));
  for (const room of rooms) {
    const cell = document.createElement("th");
    const letter = document.createElement("div");
    letter.className = "room-letter";
    letter.textContent = room.room;
    const capacity = document.createElement("div");
    capacity.className = "room-capacity";
    capacity.textContent = `${room.capacity} people`;
    cell.append(letter, capacity);
    head.append(cell);
  }

  const skipRemaining = schedules.map(() => 0);
  for (let index = 0; index < times.length; index++) {
    const time = times[index];
    const row = table.insertRow();
    const clock = time.slice(11);
    const isFullHour = clock.endsWith(":00");
    if (!isFullHour) row.classList.add("half-hour");
    const label = row.insertCell();
    label.className = "time";
    label.textContent = isFullHour ? clock : "";

    for (let roomIndex = 0; roomIndex < schedules.length; roomIndex++) {
      if (skipRemaining[roomIndex] > 0) {
        skipRemaining[roomIndex]--;
        continue;
      }
      const cell = row.insertCell();
      const range = schedules[roomIndex].ranges.find((candidate) => candidate.start <= time && time < candidate.end);
      if (!range || range.status !== "occupied") {
        cell.className = "slot-free";
        cell.title = "Free";
        continue;
      }
      let span = 1;
      let cursor = index + 1;
      while (cursor < times.length && times[cursor] < range.end) {
        span++;
        cursor++;
      }
      if (span > 1) cell.rowSpan = span;
      skipRemaining[roomIndex] = span - 1;
      const rangeLabel = `${range.start.slice(11)}–${range.end.slice(11)}`;
      const startLabel = range.start.slice(11);
      const kind = range.mine ? "mine" : "occupied";
      const titleText = range.mine ? range.title : "Occupied";
      const block = document.createElement("div");
      const titleLine = document.createElement("div");
      titleLine.className = "booking-title";
      if (span === 1) {
        block.className = `booking single ${kind}`;
        titleLine.textContent = `${titleText} · ${startLabel}`;
        block.append(titleLine);
      } else {
        block.className = `booking ${span === 2 ? "double" : "multi"} ${kind}`;
        titleLine.textContent = titleText;
        const timeLine = document.createElement("div");
        timeLine.className = "booking-time";
        timeLine.textContent = rangeLabel;
        block.append(titleLine, timeLine);
      }
      if (range.mine) {
        cell.title = `${range.title} · ${rangeLabel} (booking ${range.booking_id})`;
      } else {
        cell.title = `Occupied · ${rangeLabel}`;
      }
      cell.append(block);
    }
  }
}

byId("day").addEventListener("change", loadSchedule);

state.token = recall("token");
state.username = recall("username");
if (state.token) api("/auth/me").then(showApp).catch(signOut);
</script>
</body>
</html>
